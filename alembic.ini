# Alembic configuration. The migration environment lives in infra/migrations.
# The database URL comes from TIA_DATABASE_URL (or the project default) at runtime —
# see infra/migrations/env.py — so no URL is duplicated here.
[alembic]
script_location = infra/migrations
prepend_sys_path = packages/tia/src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
