[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tia"
version = "0.1.0"
description = "Trader-IA — autonomous quantitative research, backtesting and paper-trading platform (simulation only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Trader-IA" }]
keywords = ["quantitative-research", "backtesting", "paper-trading", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "structlog>=24.1",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "pyjwt>=2.8",
]
db = [
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13",
  "aiosqlite>=0.20",
]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
llm = ["anthropic>=0.40"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests",
]
all = [
  "tia[api,db,postgres,redis,llm]",
]

[project.scripts]
tia-server = "tia.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["packages/tia/src/tia"]

[tool.hatch.build.targets.sdist]
include = ["packages/tia/src/tia", "README.md", "docs"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["packages/tia/src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: long running tests",
  "integration: requires more than one component wired together",
  "e2e: end-to-end pipeline test",
  "failure: failure injection / chaos test",
  "network: requires outbound network (skipped by default)",
]
filterwarnings = ["error::DeprecationWarning:tia.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/tia/src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pycodestyle / pyflakes
  "I",               # isort
  "UP",              # pyupgrade
  "B",               # bugbear
  "C4",              # comprehensions
  "SIM",             # simplify
  "RUF",             # ruff specific
  "ASYNC",           # async correctness
  "DTZ",             # naive datetime usage — critical for a trading system
  "S",               # bandit security rules
  "T20",             # no print()
  "RET", "ARG", "PTH",
]
ignore = [
  "E501",    # line length handled by formatter
  "B008",    # FastAPI Depends() in defaults
  "S311",    # non-crypto RNG is intentional (seeded simulation)
  "RET504",  # explicit assignment before return aids debugging
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "DTZ", "SIM117", "PTH", "T20"]
"scripts/**" = ["T20", "S101"]
"packages/tia/src/tia/cli.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["tia"]

[tool.mypy]
python_version = "3.11"
mypy_path = "packages/tia/src"
packages = ["tia"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "anthropic.*", "redis.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["packages/tia/src/tia"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
